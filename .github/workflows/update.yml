name: Update Situation Room

on:
  schedule:
    - cron: '*/30 * * * *' # Runs automatically every 30 minutes
  workflow_dispatch:       # Lets you trigger a manual refresh button anytime

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Situation Room Collector & Generator
        run: python build_dashboard.py

      - name: Commit and push updated dashboard
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Situation Room Bot"
          git add index.html intel_log.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Situation Room Intel"
          git push
